<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alcancía</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2315834f'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3E$%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#inicio">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#15834f"/><text x="16" y="22" font-size="17" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#fff">$</text></svg>
      Alcancía
    </a>
    <nav id="nav" aria-label="Secciones">
      <a href="#inicio" data-route="inicio">Inicio</a>
      <a href="#movimientos" data-route="movimientos">Movimientos</a>
      <a href="#presupuesto" data-route="presupuesto">Presupuesto</a>
      <a href="#metas" data-route="metas">Metas</a>
      <a href="#cuentas" data-route="cuentas">Cuentas y deudas</a>
      <a href="#reportes" data-route="reportes">Reportes</a>
      <a href="#progreso" data-route="progreso">Progreso</a>
    </nav>
    <div class="topbar-right">
      <div id="top-stats" class="top-stats"></div>
      <button class="btn btn-primary btn-sm" data-action="new-movement" data-type="gasto" data-tip="Atajo: tecla G">+ Gasto</button>
      <button class="icon-btn" data-action="theme" aria-label="Cambiar tema claro/oscuro" data-tip="Tema claro / oscuro"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view" class="container"></main>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <!-- Scripts clásicos (sin módulos) para que también funcione abriendo el archivo directamente. -->
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/view-inicio.js"></script>
  <script src="js/view-movimientos.js"></script>
  <script src="js/view-presupuesto.js"></script>
  <script src="js/view-metas.js"></script>
  <script src="js/view-cuentas.js"></script>
  <script src="js/view-reportes.js"></script>
  <script src="js/view-progreso.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
